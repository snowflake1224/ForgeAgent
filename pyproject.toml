[project]
name = "forgeagent"
version = "0.1.0"
description = "Autonomous software-engineering platform with multi-agent orchestration, MCP tools, sandboxed execution, and reproducible evaluation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "ForgeAgent Contributors" }]
keywords = ["agents", "mcp", "swe-bench", "orchestration", "llm"]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "typer>=0.12.0",
  "rich>=13.9.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "aiosqlite>=0.20.0",
  "redis>=5.2.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-exporter-otlp-proto-http>=1.28.0",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "prometheus-client>=0.21.0",
  "docker>=7.1.0",
  "gitpython>=3.1.43",
  "pyyaml>=6.0.2",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.12",
  "tenacity>=9.0.0",
  "jsonschema>=4.23.0",
  "structlog>=24.4.0",
  "psycopg[binary]>=3.3.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "httpx>=0.27.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-PyYAML>=6.0.12",
  "types-redis>=4.6.0",
]

[project.scripts]
forge = "forgeagent.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/forgeagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: integration tests",
  "sandbox: docker sandbox tests",
  "e2e: end-to-end tests",
  "slow: slow tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "apps", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["forgeagent"]
mypy_path = "packages"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.coverage.run]
source = ["packages/forgeagent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[dependency-groups]
dev = [
    "types-docker>=7.2.0.20260819",
    "types-jsonschema>=4.26.0.20260518",
]
