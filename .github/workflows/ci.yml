name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: uv run ruff check packages/forgeagent tests
      - run: uv run mypy packages/forgeagent
      - run: uv run pytest -q
      - name: Build sandbox image
        run: docker build -f infra/Dockerfile.sandbox -t forgeagent/sandbox:latest .
      - name: Validate live Docker sandbox
        env:
          FORGE_RUN_DOCKER_TESTS: "1"
        run: uv run pytest -q tests/test_docker_sandbox.py
